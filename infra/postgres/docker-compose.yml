services:
  postgres:
    image: postgres:17.4-alpine
    container_name: gyd-postgres
    ports:
      - "5433:5432"  # 映射到 5433 避免与宿主机默认 5432 冲突
    environment:
      POSTGRES_USER: gyd
      POSTGRES_PASSWORD: gyd123  # 仅本地开发
    volumes:
      - gyd-postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d  # 自动创建三个数据库
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyd"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  gyd-postgres-data:
    name: gyd-postgres-data