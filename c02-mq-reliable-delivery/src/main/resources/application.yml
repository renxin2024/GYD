spring:
  application:
    name: gyd-c02-mq-reliable-delivery

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /

    # 发送端可靠投递的两道开关（各管一件事，缺一不可）：
    # confirm  —— Broker 收到消息后回执（消息进没进 Broker）
    # returns  —— 消息路由不到任何队列时退回（消息进没进队列）
    publisher-confirm-type: correlated
    publisher-returns: true

    listener:
      simple:
        # 手动 ack：由业务代码决定什么时候确认，这是「不丢」与「不重」的取舍点
        acknowledge-mode: manual
        # prefetch：一个消费者最多同时持有多少条未确认消息。
        # 它直接决定消费者崩溃时最多有多少条会被重新投递。
        # 可用环境变量 SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH 覆盖，便于对比实验。
        prefetch: 10
        # 手动 ack 场景下关掉框架级自动重试，重试节奏由重试队列的 TTL 控制
        retry:
          enabled: false

# 演示用参数：orderId 含 "slow" 时每条消息故意多处理这么久（毫秒）
gyd:
  c02:
    slow-processing-ms: 200

server:
  port: 8080
