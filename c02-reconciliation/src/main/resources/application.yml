# GYD C02 跨行清算对账 —— 默认配置（公共部分）
# 各 profile 通过 application-{profile}.yml 覆盖端口和数据库。

spring:
  application:
    name: gyd-c02-reconciliation

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    listener:
      simple:
        prefetch: 10