# 结算服务（含对账 Job）—— 端口 18080
#
# 拆模块后不再需要 profile：本模块就是一个进程，配置直接写在 application.yml。
# 银行侧仍保留 bank-a / bank-b 两个 profile，因为那是同一份代码的两个实例。

server:
  port: 18080

spring:
  application:
    name: gyd-c02-settlement

  datasource:
    url: jdbc:postgresql://localhost:5433/gyd_c02_settlement
    username: gyd
    password: gyd123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    listener:
      simple:
        prefetch: 10

# 对账 Job 配置
gyd:
  c02:
    recon:
      # 银行数据只能走 REST 拉（三个进程各连自己的库，跨库直连在模块层面就不存在）
      bank-a-url: http://localhost:18081
      bank-b-url: http://localhost:18082
      schedule-ms: 60000
      initial-delay-ms: 30000
